# =====================================================================
# CẤU HÌNH VNPAY SANDBOX (môi trường thử nghiệm - không trừ tiền thật)
# Đăng ký tài khoản test miễn phí tại: https://sandbox.vnpayment.vn/devreg/
# VNPay sẽ gửi email chứa Terminal ID (TmnCode) và Secret Key (HashSecret).
# Điền 2 giá trị đó vào bên dưới rồi Clean & Build lại dự án.
# =====================================================================
vnpay.tmnCode=YOUR_TMN_CODE
vnpay.hashSecret=YOUR_HASH_SECRET
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# Để trống = tự lấy theo địa chỉ web hiện tại (vd: http://localhost:8080/TicketHub/payment/vnpay-return)
vnpay.returnUrl=

# Số phút giữ vé cho đơn chưa thanh toán (quá hạn sẽ tự hủy và trả vé về kho)
vnpay.expireMinutes=15
